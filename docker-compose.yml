services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windscope-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
